    <link rel="stylesheet" href="../css/base/reset.css">

    <link rel="stylesheet" href="../css/base/typography.css">

    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/footer.css">

    <link rel="stylesheet" href="../css/pages/task-details.css">

</head>


<body>


    <!-- Navbar -->

    <header class="site-header">

        <nav class="navbar">

            <a
                href="../index.html"
                class="navbar-logo"
            >
                SmartTask
            </a>


            <button
                class="menu-toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>


            <ul class="navbar-menu">

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="tasks.html">
                        Tasks
                    </a>
                </li>

                <li>
                    <a href="analytics.html">

                    </a>
                </li>

                <li>
                    <a href="ai-assistant.html">

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>


        <!-- Task Details -->

        <section class="task-details">

            <div class="task-details-header">

                <p class="section-label">
                    TASK DETAILS
                </p>

                <h1 id="task-title">
                    Loading...
                </h1>

                <p id="task-description">
                    Loading task details...
                </p>

            </div>


            <div class="task-details-card">


                <div class="task-detail">

                    <span class="task-detail-label">
                        Status
                    </span>

                    <span
                        id="task-status"
                        class="task-status"
                    >
                        Loading...
                    </span>

                </div>


                <div class="task-detail">

                    <span class="task-detail-label">
                        Description
                    </span>

                    <p id="task-detail-description">
                        Loading...
                    </p>

                </div>


                <a
                    href="tasks.html"
                    class="btn btn-primary"
                >
                    Back to Tasks
                </a>


            </div>

        </section>


    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <p>
            © 2026 SmartTask. All rights reserved.
        </p>
